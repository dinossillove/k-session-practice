<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Felxbox n Grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Flexbox</h1>
    <div class="gallery-wrapper">
      <div class="item-gallery">
        <img
          src="https://images.pexels.com/photos/39201706/pexels-photo-39201706.jpeg"
          alt="gallery"
          class="gallery-picture"
        />
      </div>
      <div class="item-gallery item-2">
        <img
          src="https://images.pexels.com/photos/39359225/pexels-photo-39359225.jpeg"
          alt="gallery"
          class="gallery-picture"
        />
      </div>
      <div class="item-gallery">
        <img
          src="https://images.pexels.com/photos/39206583/pexels-photo-39206583.jpeg"
          alt="gallery"
          class="gallery-picture"
        />
      </div>
    </div>
    <div class="gallery-grow">
      <div class="item-gallery-grow item-grow-1">
        <img
          src="https://images.pexels.com/photos/39201706/pexels-photo-39201706.jpeg"
          alt="gallery"
          class="gallery-picture-grow"
        />
      </div>

      <div class="item-gallery-grow item-grow-2">
        <img
          src="https://images.pexels.com/photos/39201706/pexels-photo-39201706.jpeg"
          alt="gallery"
          class="gallery-picture-grow"
        />
      </div>

      <div class="item-gallery-grow item-grow-3">
        <img
          src="https://images.pexels.com/photos/39201706/pexels-photo-39201706.jpeg"
          alt="gallery"
          class="gallery-picture-grow"
        />
      </div>
    </div>
  </body>
</html>
