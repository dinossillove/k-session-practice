<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Belanja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <div class="form-wrapper">
     <div class ="header-wrapper">
         <h1 id="header-form">Cart Form</h1>
         <button class ="toggle-theme">Toggle theme</button>
     </div>
      <form id="addItem">
        <div class="input-wrapper">
          <label for="item-name" id="name-label">Nama Barang</label>
          <input type="text" id="item-input" class="item-input" />
        </div>
        <button type="submit" class="submit-button">Tambah</button>
      </form>
    </div>

    <div class="cart-list-wrapper">
      <h2>Cart List</h2>
      <ul id="cart-list"></ul>
    </div>

    <script src="dist/script.js"></script>

</body>
</html>
